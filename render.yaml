services:
  - type: web
    name: compliant-ai-gateway
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GATEWAY_HOST
        value: 127.0.0.1
      - key: GATEWAY_CREDENTIAL_MASTER_KEY
        sync: false
      - key: KP_AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false

  # revd — Rust Qwen/DeepSeek adapter engine (single-account guest tokens).
  # /v1/chat/completions + /v1/models + /health, per-key RPM limit, anti-sleep
  # self-ping. Token env vars dashboard se set hote hain (sync: false).
  - type: web
    name: rev-qwen-engine
    runtime: docker
    plan: free
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: QWEN_TOKEN_JSON
        sync: false
      - key: DS_TOKEN_JSON
        sync: false
      - key: REV_RPM
        sync: false
      - key: REV_KEEPALIVE_URL
        sync: false
